name: CI/CD

# Runs quality checks (lint + build) on every push and PR. Actual
# deployment is handled entirely by Vercel's native GitHub integration
# (auto-deploys on push to main, creates preview URLs for branches/PRs) —
# there is no separate deploy step here, to avoid two deployment paths
# fighting each other.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build
